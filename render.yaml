# Free permanent hosting for the salon server (Render Blueprint).
# Everything secret is left as "sync: false", so the owner pastes the values in
# the Render dashboard and nothing private is ever committed here.
services:
  - type: web
    name: ayan-salon
    runtime: docker
    plan: free
    region: singapore
    healthCheckPath: /actuator/health
    autoDeploy: true
    envVars:
      - key: SPRING_PROFILES_ACTIVE
        sync: false
      - key: JDBC_DATABASE_URL
        sync: false
      - key: JDBC_DATABASE_USERNAME
        sync: false
      - key: JDBC_DATABASE_PASSWORD
        sync: false
      - key: AYAN_AUTH_SESSION_SECRET
        sync: false
      - key: AYAN_AUTH_OWNER_SALON_ID
        value: 00000000-0000-0000-0000-000000000001
      - key: AYAN_AUTH_OWNER_PHONE
        sync: false
      - key: AYAN_AUTH_OWNER_PIN
        sync: false
      - key: AYAN_SMS_PROVIDER
        sync: false
      - key: AYAN_TWILIO_ACCOUNT_SID
        sync: false
      - key: AYAN_TWILIO_AUTH_TOKEN
        sync: false
      - key: AYAN_TWILIO_FROM_NUMBER
        sync: false
      - key: AYAN_WHATSAPP_TOKEN
        sync: false
      - key: AYAN_WHATSAPP_PHONE_NUMBER_ID
        sync: false
      - key: AYAN_SMS_WEBHOOK_URL
        sync: false
      - key: AYAN_SMS_WEBHOOK_TOKEN
        sync: false
      - key: AYAN_WEB_ALLOWED_ORIGINS
        sync: false
