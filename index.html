<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#1E1E20" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Salon" />
    <meta name="description" content="Neighbourhood salon bookings, wallet credit, reminders and an owner dashboard in PKR." />
    <meta name="api-base-url" content="" />
    <meta name="salon-id" content="00000000-0000-0000-0000-000000000001" />
    <link rel="manifest" href="manifest.webmanifest" />
    <link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png" />
    <link rel="icon" type="image/png" sizes="192x192" href="icon-192.png" />
    <link rel="icon" type="image/png" sizes="512x512" href="icon-512.png" />
    <title>Salon</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Playfair+Display:wght@600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css?v=ayan13" />
  </head>
  <body>
    <div id="app" aria-live="polite"></div>
    <div id="toast-region" class="toast-region" aria-live="assertive"></div>
    <script>
      (() => {
        const localQa = /^(localhost|127\.0\.0\.1|\[::1\])$/i.test(location.hostname || "")
          && /(?:^|[?&])mode=qa(?:&|$)/i.test(location.search || "");
        if (localQa) document.write('<script src="qa-seed.js?v=ayan1"><' + '/script>');
      })();
    </script>
    <script>
      /*
       * This app is offline. All salon data lives on the phone itself, and
       * nothing is ever published to the internet.
       *
       * A salon server address is used only when somebody deliberately supplies
       * one, in exactly two ways:
       *
       *   1. the link carries ?apiBaseUrl=...          -> use it as given
       *   2. the Android shell injects the global      -> use it as given
       *
       * There is no automatic discovery: the page never contacts GitHub or any
       * other computer looking for an address. When the page happens to be
       * served by a local server that answers /actuator/health, that same origin
       * is used, which keeps an optional private setup working.
       */
      (() => {
        const meta = document.querySelector('meta[name="api-base-url"]');
        const salonMeta = document.querySelector('meta[name="salon-id"]');
        const params = new URLSearchParams(location.search || "");
        function currentBase() {
          return String(window.__AYAN_API_BASE_URL__ || (meta && meta.getAttribute("content")) || "").trim().replace(/\/+$/, "");
        }
        function apply(base, salon) {
          const clean = String(base || "").trim().replace(/\/+$/, "");
          if (!clean) return false;
          try { new URL(clean); } catch (_) { return false; }
          window.__AYAN_API_BASE_URL__ = clean;
          if (meta) meta.setAttribute("content", clean);
          const cleanSalon = String(salon || "").trim();
          if (cleanSalon) {
            window.__AYAN_SALON_ID__ = cleanSalon;
            if (salonMeta) salonMeta.setAttribute("content", cleanSalon);
          }
          return true;
        }
        function readJson(url, timeoutMs) {
          const controller = typeof AbortController === "function" ? new AbortController() : null;
          const timer = setTimeout(() => { try { if (controller) controller.abort(); } catch (_) { /* already finished */ } }, timeoutMs);
          return fetch(url, { cache: "no-store", signal: controller ? controller.signal : undefined })
            .then((response) => (response.ok ? response.json() : null))
            .catch(() => null)
            .then((value) => { clearTimeout(timer); return value; });
        }
        function sameOriginServer() {
          return readJson(`${location.origin}/actuator/health`, 3000).then((health) => {
            if (health && String(health.status || "").toUpperCase() === "UP") return apply(location.origin);
            return false;
          });
        }

        window.__AYAN_API_BOOT__ = Promise.resolve();
        if (params.get("apiBaseUrl") || currentBase()) return;

        // Only a page that a local server actually delivered (http/https) may
        // adopt its own origin. The bundled phone copy opens offline, always.
        if (location.protocol === "https:" || location.protocol === "http:") {
          window.__AYAN_API_BOOT__ = sameOriginServer().catch(() => false);
        }
      })();
    </script>
    <script>
      (() => {
        // Wait for the address lookup (never longer than the time-boxes above),
        // then start the app in one known order: adapter first, app second.
        const boot = window.__AYAN_API_BOOT__ || Promise.resolve();
        const load = (src) => new Promise((done) => {
          const element = document.createElement("script");
          element.src = src;
          element.onload = done;
          element.onerror = done;
          document.body.appendChild(element);
        });
        boot.then(() => load("api-client.js?v=ayan6")).then(() => load("app.js?v=ayan15"));
      })();
    </script>
    <script>if ('serviceWorker' in navigator) navigator.serviceWorker.register('service-worker.js').catch(() => {});</script>
  </body>
</html>
