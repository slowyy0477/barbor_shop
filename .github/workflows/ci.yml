name: Ayan Beauty Salon CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Make wrapper scripts executable
        run: chmod +x server/mvnw android/gradlew

      - name: Check browser JavaScript
        run: node --check app.js

      - name: Run dependency-free Java domain checks
        shell: bash
        run: |
          mkdir -p tmp/java-ci
          javac -source 8 -target 8 -Xlint:all -d tmp/java-ci \
            android/app/src/main/java/com/cornerchair/salon/model/*.java \
            android/app/src/main/java/com/cornerchair/salon/security/*.java
          java -cp tmp/java-ci com.cornerchair.salon.model.DomainSelfTest
          java -cp tmp/java-ci com.cornerchair.salon.model.HardeningSelfTest
          java -cp tmp/java-ci com.cornerchair.salon.security.NavigationPolicySelfTest

      - name: Run Spring tests
        working-directory: server
        run: ./mvnw -q test

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android API 30
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-30" "build-tools;30.0.3"

      - name: Sync bundled web assets
        shell: pwsh
        run: ./android/sync-assets.ps1

      - name: Set up Java 11 for Android Gradle
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '11'

      - name: Build Android debug APK
        working-directory: android
        run: ./gradlew --no-daemon assembleDebug

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: ayan-salon-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk

      - name: Generate APK checksum
        shell: bash
        run: sha256sum android/app/build/outputs/apk/debug/app-debug.apk > android/app/build/outputs/apk/debug/SHA256SUMS.txt

      - name: Upload APK checksum
        uses: actions/upload-artifact@v4
        with:
          name: ayan-salon-debug-apk-sha256
          path: android/app/build/outputs/apk/debug/SHA256SUMS.txt
