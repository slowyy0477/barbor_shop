services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    env_file: .env
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-ayan_salon}
      POSTGRES_USER: ${POSTGRES_USER:-ayan}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10

  server:
    build:
      context: ./server
    restart: unless-stopped
    env_file: .env
    environment:
      JDBC_DATABASE_URL: jdbc:postgresql://db:5432/${POSTGRES_DB:-ayan_salon}?sslmode=disable
      JDBC_DATABASE_USERNAME: ${POSTGRES_USER:-ayan}
      JDBC_DATABASE_PASSWORD: ${POSTGRES_PASSWORD}
      AYAN_WEB_ALLOWED_ORIGINS: ${AYAN_WEB_ALLOWED_ORIGINS:-https://localhost}
    depends_on:
      db:
        condition: service_healthy
    expose:
      - "8080"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://127.0.0.1:8080/actuator/health | grep -q 'UP'"]
      interval: 30s
      timeout: 5s
      retries: 5

  caddy:
    image: caddy:2.8-alpine
    restart: unless-stopped
    env_file: .env
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ./:/srv:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      server:
        condition: service_healthy

volumes:
  postgres_data:
  caddy_data:
  caddy_config:
