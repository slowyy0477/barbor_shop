<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#1E1E20" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Ayan Salon" />
    <meta name="description" content="Ayan Beauty Salon booking, wallet, reminders and owner dashboard app for PKR." />
    <meta name="api-base-url" content="" />
    <meta name="salon-id" content="00000000-0000-0000-0000-000000000001" />
    <link rel="manifest" href="manifest.webmanifest" />
    <link rel="apple-touch-icon" href="icon.svg" />
    <title>Ayan Beauty Salon | Salon OS</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Playfair+Display:wght@600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css?v=ayan12" />
  </head>
  <body>
    <div id="app" aria-live="polite"></div>
    <div id="toast-region" class="toast-region" aria-live="assertive"></div>
    <script>
      (() => {
        const localQa = /^(localhost|127\.0\.0\.1|\[::1\])$/i.test(location.hostname || "")
          && /(?:^|[?&])mode=qa(?:&|$)/i.test(location.search || "");
        if (localQa) document.write('<script src="qa-seed.js?v=ayan1"><' + '/script>');
      })();
    </script>
    <script>
      /*
       * Where is the salon server? The page can be opened in four different ways
       * and each one needs a different answer:
       *
       *   1. the link carries ?apiBaseUrl=...            -> use it as given
       *   2. the Android shell stored an address         -> it injects the global
       *   3. the salon server itself delivered this page -> same origin
       *   4. the app is hosted online (GitHub Pages)     -> read api.json, which
       *      the salon laptop republishes whenever its free tunnel address moves
       *
       * The address is resolved before app.js starts so the first screen is
       * already in the right mode. Nothing here can break the offline app: every
       * lookup is time-boxed and a failure simply leaves the offline shell.
       */
      (() => {
        const PUBLISHED_CONFIG_URL = "https://slowyy0477.github.io/barbor_shop/api.json";
        const DISCOVERED_KEY = "ayan-discovered-api-base";
        const meta = document.querySelector('meta[name="api-base-url"]');
        const salonMeta = document.querySelector('meta[name="salon-id"]');
        const params = new URLSearchParams(location.search || "");
        const notify = (name) => { try { window.dispatchEvent(new Event(name)); } catch (_) { /* older shells */ } };
        function currentBase() {
          return String(window.__AYAN_API_BASE_URL__ || (meta && meta.getAttribute("content")) || "").trim().replace(/\/+$/, "");
        }
        function apply(base, salon) {
          const clean = String(base || "").trim().replace(/\/+$/, "");
          if (!clean) return false;
          try { new URL(clean); } catch (_) { return false; }
          window.__AYAN_API_BASE_URL__ = clean;
          if (meta) meta.setAttribute("content", clean);
          const cleanSalon = String(salon || "").trim();
          if (cleanSalon) {
            window.__AYAN_SALON_ID__ = cleanSalon;
            if (salonMeta) salonMeta.setAttribute("content", cleanSalon);
          }
          return true;
        }
        function readJson(url, timeoutMs) {
          const controller = typeof AbortController === "function" ? new AbortController() : null;
          const timer = setTimeout(() => { try { if (controller) controller.abort(); } catch (_) { /* already finished */ } }, timeoutMs);
          return fetch(url, { cache: "no-store", signal: controller ? controller.signal : undefined })
            .then((response) => (response.ok ? response.json() : null))
            .catch(() => null)
            .then((value) => { clearTimeout(timer); return value; });
        }
        function publishedConfig() {
          return readJson(`${PUBLISHED_CONFIG_URL}?t=${Date.now()}`, 4000)
            .then((value) => (value && apply(value.apiBaseUrl, value.salonId) ? true : false))
            .catch(() => false);
        }
        function sameOriginServer() {
          return readJson(`${location.origin}/actuator/health`, 3000).then((health) => {
            if (health && String(health.status || "").toUpperCase() === "UP") return apply(location.origin);
            return false;
          });
        }

        window.__AYAN_API_BOOT__ = Promise.resolve();
        if (params.get("apiBaseUrl") || currentBase()) return;

        // 3. Same-origin hosting: the salon server answered this request.
        if (location.protocol === "https:" || location.protocol === "http:") {
          window.__AYAN_API_BOOT__ = sameOriginServer()
            .then((found) => found || publishedConfig())
            .catch(() => false);
          return;
        }

        // 2. The offline Android bundle: start instantly from the last address
        //    that was published for this salon, then refresh it in the
        //    background. A phone that never finds a server stays offline, and a
        //    phone the owner deliberately set to offline mode stays offline.
        if (location.protocol === "file:") {
          let cached = "";
          let optedOut = false;
          try {
            cached = String(localStorage.getItem(DISCOVERED_KEY) || "");
            optedOut = localStorage.getItem("ayan-api-opt-out") === "1";
          } catch (_) { cached = ""; optedOut = false; }
          if (optedOut) return;
          if (cached && cached !== "none") apply(cached);
          publishedConfig().then((found) => {
            const fresh = currentBase();
            try {
              if (found && fresh && fresh !== cached) localStorage.setItem(DISCOVERED_KEY, fresh);
              if (!found && !cached) localStorage.setItem(DISCOVERED_KEY, "none");
            } catch (_) { /* private storage */ }
            if (found && fresh && fresh !== cached) notify("ayan-api-discovered");
          });
        }
      })();
    </script>
    <script>
      (() => {
        // Wait for the address lookup (never longer than the time-boxes above),
        // then start the app in one known order: adapter first, app second.
        const boot = window.__AYAN_API_BOOT__ || Promise.resolve();
        const load = (src) => new Promise((done) => {
          const element = document.createElement("script");
          element.src = src;
          element.onload = done;
          element.onerror = done;
          document.body.appendChild(element);
        });
        boot.then(() => load("api-client.js?v=ayan5")).then(() => load("app.js?v=ayan14"));
      })();
    </script>
    <script>if ('serviceWorker' in navigator) navigator.serviceWorker.register('service-worker.js').catch(() => {});</script>
  </body>
</html>
