buildscript {
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        // AGP 4.2.2 runs with the Java 8 toolchain available on the workstation.
        classpath 'com.android.tools.build:gradle:4.2.2'
    }
}

allprojects {
    repositories {
        google()
        mavenCentral()
    }
}

task clean(type: Delete) {
    delete rootProject.buildDir
}
